name: GG Economics failure triage
# Every run of every workflow lands here when it finishes. Failures are classified + logged in autopilot/log/failures.json:
# transient → re-run once automatically; code/data → left open for the FIXER routine (Anthropic, every 2 h, autopilot/FIXER.md);
# owner-only (billing, lost login) → one phone alert. A later green run of the same workflow + date closes the entry.
on:
  workflow_run:
    workflows: ["GG Economics build + publish", "GG Economics delivery monitor", "GG Economics weekly long video (build + upload)",
                "GG Economics long-form upload", "GG Economics unbook + rebuild", "GG Economics engineering gate"]
    types: [completed]
concurrency: { group: triage, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.run_attempt > 1 || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python3 autopilot/scripts/triage.py ${{ github.event.workflow_run.id }}
      - name: Save
        run: |
          git config user.name "GG Economics bot" && git config user.email "bot@users.noreply.github.com"
          git add autopilot/log/failures.json autopilot/queue && git commit -qm "triage ${{ github.event.workflow_run.id }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i*4)); done
