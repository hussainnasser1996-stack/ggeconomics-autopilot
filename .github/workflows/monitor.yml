name: GG Economics delivery monitor
on:
  schedule: [{ cron: "40 */6 * * *" }]     # GitHub's scheduler is unreliable on new repos (16 Nov: 0 of 2 fired) ...
  push:                                      # ... so the Anthropic "heartbeat" routine also pushes this file every 6 h
    paths: ["autopilot/log/heartbeat.txt"]
  workflow_dispatch:
concurrency: { group: monitor, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { BUFFER_API_KEY: "${{ secrets.BUFFER_API_KEY }}", GH_TOKEN: "${{ github.token }}",
           IG_ACCESS_TOKEN: "${{ secrets.IG_ACCESS_TOKEN }}", IG_USER_ID: "${{ secrets.IG_USER_ID }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: YouTube token
        env: { YT: "${{ secrets.YT_TOKEN_JSON }}" }
        run: mkdir -p autopilot/keys && printf '%s' "$YT" > autopilot/keys/youtube-token.json && pip install -q google-api-python-client google-auth google-auth-oauthlib
      - run: python3 autopilot/scripts/monitor.py
      - name: Analytics (scoreboard for the brain)
        continue-on-error: true
        run: python3 autopilot/scripts/analytics.py
      - name: YouTube question comment + captions (narrated only)
        continue-on-error: true
        run: python3 autopilot/scripts/yt_engage.py
      - name: Comments (post the routine's replies, collect new ones)
        continue-on-error: true
        run: python3 autopilot/scripts/engage.py
      - run: rm -f autopilot/keys/youtube-token.json
      - name: Save
        run: |
          git config user.name "GG Economics bot" && git config user.email "bot@users.noreply.github.com"
          git add -A autopilot && git commit -qm "monitor $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
