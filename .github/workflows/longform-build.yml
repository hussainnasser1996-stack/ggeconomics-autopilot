name: GG Economics weekly long video (build + upload)
# Every Friday: Steam's most-played chart -> the 8-min "Top 10 games on Steam" (voice intro, owner's pick 21 Nov) -> gates
# -> GitHub release asset -> YouTube, scheduled for Saturday 16:00 UTC (yt_long.py). No Mac anywhere.
on:
  schedule:
    - cron: "0 5 * * 5"            # Friday 05:00 UTC
  workflow_dispatch:
    inputs:
      publish: { description: "Publish date YYYY-MM-DD (empty = next Saturday)", required: false }
      dry: { description: "Build + gates only: no release, no upload", type: boolean, default: true }
concurrency: { group: longform-build, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/../hf
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish date
        run: |
          P="${{ inputs.publish }}"; [ -z "$P" ] && P=$(date -u -d "next saturday" +%F)
          grep -q "^mode: paused" autopilot/CONTROL.md && [ "$DRY" = 0 ] && { echo "paused"; exit 1; }
          [ "$DRY" = 0 ] && [ -f "autopilot/longform/$P/uploaded.json" ] && { echo "$P already uploaded"; exit 1; }
          echo "P=$P" >> $GITHUB_ENV; echo "publish date $P (dry=$DRY)"
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng tesseract-ocr > /dev/null
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: studio/package-lock.json }
      - uses: actions/cache@v4
        with: { path: "${{ github.workspace }}/../hf", key: hf-models-v1 }
      - uses: actions/cache@v4
        with:
          path: |
            .venv
            studio/node_modules
            ~/.cache/remotion
          key: deps-v1-${{ hashFiles('requirements.txt', 'studio/package-lock.json') }}
      - name: Install
        run: |
          [ -x .venv/bin/python ] || { python -m venv .venv && .venv/bin/pip install -q -r requirements.txt; }
          [ -d studio/node_modules/remotion ] || (cd studio && npm ci --silent)
          (cd studio && npx remotion browser ensure)
      - name: Build (data, footage, voice, render, thumbnail, gates, meta)
        run: bash autopilot/scripts/longform/lf_build.sh "$P"
      - name: Review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ env.P }}
          path: |
            autopilot/longform/${{ env.P }}/
          if-no-files-found: ignore
      - name: Release asset
        if: env.DRY == '0'
        run: gh release create "longform-$P" --title "Long-form $P" --notes "Weekly Top 10 on Steam" "work/lf/top10-$P.mp4"
      - name: Upload to YouTube (scheduled Saturday 16:00 UTC)
        if: env.DRY == '0'
        env: { YT: "${{ secrets.YT_TOKEN_JSON }}" }
        run: |
          mkdir -p autopilot/keys && printf '%s' "$YT" > autopilot/keys/youtube-token.json
          .venv/bin/python autopilot/scripts/yt_long.py "autopilot/longform/$P"
          rm -f autopilot/keys/youtube-token.json
      - name: Save
        if: always() && env.DRY == '0'
        run: |
          rm -f autopilot/keys/youtube-token.json
          git config user.name "GG Economics bot" && git config user.email "bot@users.noreply.github.com"
          git add -A "autopilot/longform/$P" && git commit -qm "long-form $P built$([ -f autopilot/longform/$P/uploaded.json ] && echo ' + uploaded')" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          [ -f "autopilot/longform/$P/uploaded.json" ] && python3 autopilot/scripts/notify.py "Long video $P uploaded, public Saturday 16:00 UTC" || true
      - name: Tell the owner it failed
        if: failure() && env.DRY == '0'
        run: python3 autopilot/scripts/notify.py "Weekly long video $P FAILED to build/upload: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
