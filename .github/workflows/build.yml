name: GG Economics build + publish
# The brain (an Anthropic cloud routine, 00:15 UTC) researches the story and commits queue/<D>/{script,spec,post,footage}.json.
# That push triggers this job: footage → voice → clips → render → gates → Buffer. No Mac anywhere.
on:
  push:
    paths: ["autopilot/queue/*/footage.json", "autopilot/queue/*/script.json", "autopilot/queue/*/go"]
  schedule:
    - cron: "0 4,12,19 * * *"     # safety net: build anything the brain wrote that is still unscheduled
  workflow_dispatch:
    inputs:
      date: { description: "Target date YYYY-MM-DD (empty = first unscheduled)", required: false }
      dry: { description: "Build everything but do not publish (test)", type: boolean, default: false }
concurrency: { group: build, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      MEDIA_REPO_DIR: ${{ github.workspace }}/../media
      HF_HOME: ${{ github.workspace }}/../hf
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Bring in the brain's branch
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git config --global user.name "GG Economics bot" && git config --global user.email "bot@users.noreply.github.com"
          git merge --no-edit -X theirs "origin/${{ github.ref_name }}"
      - name: Pick the date
        id: d
        run: |
          D="${{ inputs.date }}"
          if [ -z "$D" ]; then
            T=$(date -u +%F); T2=$(date -u -d tomorrow +%F)
            for q in autopilot/queue/*/; do q=${q%/}; d=${q##*/}
              [[ "$d" < "$T" || "$d" > "$T2" ]] && continue      # only today / tomorrow are ever auto-built
              [ -f "$q/script.json" ] && [ -f "$q/post.json" ] && [ ! -f "$q/buffer_ids.json" ] && [ ! -f "$q/gates_failed" ] && { D=$d; break; }
            done
          fi
          grep -q "^mode: paused" autopilot/CONTROL.md && D=""
          echo "D=$D" >> $GITHUB_ENV; echo "go=$([ -n "$D" ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT; echo "target: ${D:-nothing to build}"
      - name: System packages
        if: steps.d.outputs.go == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zsh espeak-ng fonts-noto-color-emoji > /dev/null
      - uses: actions/setup-python@v5
        if: steps.d.outputs.go == '1'
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - uses: actions/setup-node@v4
        if: steps.d.outputs.go == '1'
        with: { node-version: "20", cache: npm, cache-dependency-path: studio/package-lock.json }
      - uses: actions/cache@v4
        if: steps.d.outputs.go == '1'
        with: { path: "${{ github.workspace }}/../hf", key: hf-models-v1 }
      - name: Install
        if: steps.d.outputs.go == '1'
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m spacy download en_core_web_sm -q || true
          (cd studio && npm ci --silent && npx remotion browser ensure)
      - name: Secrets to files
        if: steps.d.outputs.go == '1'
        env: { YT: "${{ secrets.YT_TOKEN_JSON }}", MK: "${{ secrets.MEDIA_DEPLOY_KEY }}" }
        run: |
          mkdir -p autopilot/keys ~/.ssh && printf '%s' "$YT" > autopilot/keys/youtube-token.json
          printf '%s\n' "$MK" > ~/.ssh/media && chmod 600 ~/.ssh/media
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/media -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
          git config --global user.name "GG Economics bot" && git config --global user.email "bot@users.noreply.github.com"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/media -o StrictHostKeyChecking=accept-new" git clone -q git@github.com:hussainnasser1996-stack/savestate-media.git "$MEDIA_REPO_DIR"
      - name: Footage
        if: steps.d.outputs.go == '1'
        run: PATH=$PWD/.venv/bin:$PATH python3 autopilot/scripts/resolve_footage.py "$D"
      - name: Voice, clips, render, checks
        if: steps.d.outputs.go == '1'
        run: PATH=$PWD/.venv/bin:$PATH zsh autopilot/scripts/build.sh "$D"
      - name: Carousel
        if: steps.d.outputs.go == '1'
        run: bash autopilot/scripts/carousel.sh "$D"
      - name: Gates
        if: steps.d.outputs.go == '1'
        run: python3 autopilot/scripts/gates.py "$D" || { touch "autopilot/queue/$D/gates_failed"; exit 1; }
      - name: Publish (Buffer)
        if: steps.d.outputs.go == '1' && inputs.dry != true
        run: |
          [ -f "autopilot/queue/$D/dry" ] && { echo "dry marker: not publishing"; exit 0; }
          python3 autopilot/scripts/publish.py "$D"
      - name: Log
        if: steps.d.outputs.go == '1' && inputs.dry != true && hashFiles(format('autopilot/queue/{0}/buffer_ids.json', env.D)) != ''
        run: |
          T=$(python3 -c "import json;print(json.load(open('autopilot/queue/$D/post.json'))['title'])")
          S=$(python3 -c "import json;print(json.load(open('autopilot/queue/$D/footage_resolved.json'))['label'])")
          I=$(python3 -c "import json;print(' · '.join(f'{k} {v}' for k,v in json.load(open('autopilot/queue/$D/buffer_ids.json'))['ids'].items()))")
          python3 - "$D · $T · footage: $S · $(head -1 autopilot/queue/$D/gates.txt) · $I · due 23:00 UTC" <<'P'
          import sys; p="autopilot/log/history.md"; L=open(p).read().split("\n"); i=next(k for k,l in enumerate(L) if l.startswith("- ")) if any(l.startswith("- ") for l in L) else len(L)
          L.insert(i, "- " + sys.argv[1]); open(p,"w").write("\n".join(L))
          P
          python3 autopilot/scripts/notify.py "$D: $T — scheduled 23:00 UTC (YouTube + Instagram)" || true
      - name: Analytics (for tomorrow's brain)
        if: always() && steps.d.outputs.go == '1'
        continue-on-error: true
        run: .venv/bin/python autopilot/scripts/analytics.py
      - name: Save state
        if: always()
        run: |
          rm -f autopilot/keys/youtube-token.json
          git add -A autopilot && git commit -qm "build ${D:-noop}" || true
          for i in 1 2 3; do git pull -q --rebase -X ours origin main && git push -q origin HEAD:main && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always() && steps.d.outputs.go == '1'
        with:
          name: build-${{ env.D }}
          retention-days: 14
          path: autopilot/queue/${{ env.D }}/
      - name: Alert on failure
        if: failure()
        run: python3 autopilot/scripts/notify.py "Build FAILED for ${D}. GitHub → ggeconomics-autopilot → Actions" high || true
