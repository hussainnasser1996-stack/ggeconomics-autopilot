name: Smoke test (no publishing)
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { HF_HOME: "${{ github.workspace }}/../hf", GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zsh espeak-ng > /dev/null
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: studio/package-lock.json }
      - uses: actions/cache@v4
        with: { path: "${{ github.workspace }}/../hf", key: hf-models-v1 }
      - name: Install
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m spacy download en_core_web_sm -q || true
          (cd studio && npm ci --silent && npx remotion browser ensure)
      - name: YouTube via yt-dlp
        continue-on-error: true
        run: .venv/bin/yt-dlp --flat-playlist -J "ytsearch3:elden ring official trailer" | python3 -c "import json,sys;print([e['id'] for e in json.load(sys.stdin)['entries']])" && PATH=$PWD/.venv/bin:$PATH timeout 600 python3 autopilot/scripts/fetch_footage.py "elden ring official trailer" yt_test --pick E3Huy2cdih0
      - name: Library footage
        run: python3 autopilot/scripts/library.py && python3 autopilot/scripts/library.py gta6_trailer_VQRLujxTm3c.mp4 && PATH=$PWD/.venv/bin:$PATH python3 autopilot/scripts/fetch_footage.py "gta6 library" d_2026_11_16 --url work/lib/gta6_trailer_VQRLujxTm3c.mp4
      - name: Steam fallback footage
        run: |
          U=$(python3 autopilot/scripts/steam_footage.py "elden ring" | grep -m1 m3u8 | xargs)
          PATH=$PWD/.venv/bin:$PATH python3 autopilot/scripts/fetch_footage.py "elden ring steam" steam_test --url "$U"
      - name: Build the 16 Nov short in the cloud
        run: |
          mkdir -p autopilot/queue/smoke && cp autopilot/queue/2026-11-16/{script,spec,post}.json autopilot/queue/smoke/
          python3 - <<'P'
          import json,subprocess
          d=float(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0","work/d_2026_11_16.mp4"],capture_output=True,text=True).stdout)
          p="autopilot/queue/smoke/spec.json"; s=json.load(open(p))
          for c in s["spec"]["clips"]: c["from"]=round(c["from"]%max(5,d-4),2)
          json.dump(s,open(p,"w"))
          P
          zsh autopilot/scripts/build.sh smoke
          ls -la autopilot/queue/smoke; cat autopilot/queue/smoke/vo_qa.txt autopilot/queue/smoke/overlay_safe.txt; head -30 autopilot/queue/smoke/critic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: "autopilot/queue/smoke/" }
